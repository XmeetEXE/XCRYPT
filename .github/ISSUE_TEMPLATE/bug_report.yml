name: Bug report
description: Report a reproducible problem in XCRYPT
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include real keys, sensitive plaintext, credentials, or other people's data."
  - type: input
    id: version
    attributes:
      label: XCRYPT version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
